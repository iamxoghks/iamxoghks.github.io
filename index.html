<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kim Taehwan / iamxoghks</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --text: #f4f1ea;
        --muted: #8b929d;
        --line: #252b33;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      main {
        width: min(720px, calc(100vw - 40px));
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 48px 0;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(40px, 9vw, 88px);
        line-height: 0.94;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      a {
        color: var(--text);
        text-underline-offset: 5px;
      }

      footer {
        margin-top: 32px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kim Taehwan<br>iamxoghks</h1>
      <p>Backend engineer portfolio is being shaped here.</p>
      <p><a href="https://github.com/iamxoghks">github.com/iamxoghks</a></p>
      <footer>made by Codex</footer>
    </main>
  </body>
</html>
